[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esdl-scattering"
version = "0.1.0"
description = "CNN forward modelling and supervised descent for electromagnetic inverse scattering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.1"]

[project.optional-dependencies]
generation = ["torchvision>=0.16"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
esdl = "esdl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["assets: checks requiring the supplied local datasets or pretrained artifacts"]
